<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareID</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="script.js"></script>
    
    <style>
        /* Custom smooth transition */
        .input-focus:focus {
            outline: none;
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-900 to-indigo-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md transform transition-all">
        <div class="text-center mb-8">
            <div class="inline-block p-3 rounded-full bg-blue-50 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="Vector D 9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.040L3 14.535a12.09 12.09 0 008 5.925 12.081 12.081 0 008-5.925l-1-8.591z" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-blue-900">CareID</h2>
            <p class="text-gray-500 mt-2">Selamat datang kembali, silakan login.</p>
        </div>

        <form onsubmit="login(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required 
                    class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl input-focus transition-all text-gray-800">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" required 
                    class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl input-focus transition-all text-gray-800">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600 cursor-pointer">
                    <input type="checkbox" class="rounded text-blue-900 mr-2"> Ingat saya
                </label>
                <a href="#" class="text-blue-700 font-medium hover:underline">Lupa Password?</a>
            </div>

            <button type="submit" 
                class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold p-3.5 rounded-xl shadow-lg hover:shadow-blue-900/30 transition-all duration-300 transform active:scale-[0.98]">
                Masuk ke Akun
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-600 text-sm">
                Belum punya akun? 
                <a href="#" class="text-blue-900 font-bold hover:underline">Daftar Sekarang</a>
            </p>
        </div>
    </div>

<script>script.js
</script>

</body>
</html>
