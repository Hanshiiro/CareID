<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareID - Platform Donasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfd; scroll-behavior: smooth; }
        .glass-blur { backdrop-filter: blur(10px); background-color: rgba(255, 255, 255, 0.8); }
        .page-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-page { opacity: 0; transform: translateY(20px); display: none; }
        .sidebar-transition { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .disaster-card:hover { transform: translateY(-8px) scale(1.02); }
    </style>
</head>
<body class="overflow-x-hidden text-slate-900">

    <header class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight cursor-pointer" onclick="backToLobby()">Care<span class="text-emerald-600">ID</span></h1>
            
            <div class="flex items-center gap-4">
                <button id="settingsBtn" class="p-2 hover:bg-slate-100 rounded-full transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                </button>
                <div class="w-10 h-10 rounded-full border-2 border-emerald-500 overflow-hidden shadow-sm">
                    <img src="https://ui-avatars.com/api/?name=User&background=10b981&color=fff" alt="Profile">
                </div>
            </div>
        </div>
    </header>

    <section id="lobbyPage" class="page-transition pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-16">
                <span class="px-4 py-2 bg-emerald-50 text-emerald-700 rounded-full text-sm font-semibold mb-6 inline-block">Mulai Berdampak Hari Ini</span>
                <h2 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">Bantu Sesama, Mulai <span class="text-emerald-600">Donasi</span></h2>
                <p class="text-slate-500 text-lg max-w-2xl mx-auto">Pilih kampanye bantuan yang ingin Anda dukung secara transparan.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="disasterGrid">
                </div>
        </div>
    </section>

    <section id="detailPage" class="page-transition hidden-page pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto">
            <button onclick="backToLobby()" class="flex items-center gap-2 text-slate-500 hover:text-emerald-600 font-semibold mb-8 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Kembali ke Lobby
            </button>

            <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm">
                <img id="detImg" src="" class="w-full h-[400px] object-cover" alt="Detail Image">
                <div class="p-8 md:p-12">
                    <h2 id="detTitle" class="text-3xl md:text-4xl font-extrabold mb-6"></h2>
                    <div class="bg-slate-50 p-6 rounded-3xl mb-8">
                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <p class="text-slate-500 text-sm mb-1">Dana Terkumpul</p>
                                <p id="detCollected" class="text-2xl font-bold text-emerald-600"></p>
                            </div>
                            <p id="detTarget" class="text-slate-400 text-sm font-medium"></p>
                        </div>
                        <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                            <div id="detProgress" class="bg-emerald-500 h-full rounded-full transition-all duration-1000"></div>
                        </div>
                    </div>
                    <p id="detDesc" class="text-slate-600 leading-relaxed text-lg mb-10"></p>
                    <button onclick="window.location.href='payment.html'" class="w-full py-5 bg-emerald-600 text-white rounded-2xl font-bold text-lg hover:bg-emerald-700 shadow-lg transition-all active:scale-[0.98]">
                        Donasi Sekarang
                    </button>
                </div>
            </div>
        </div>
    </section>

    <div id="sidebarOverlay" class="fixed inset-0 z-[50] hidden bg-slate-900/40 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div id="sidebarContent" class="absolute right-0 top-0 bottom-0 w-full md:w-1/2 bg-white sidebar-transition translate-x-full shadow-2xl flex flex-col">
            <div class="p-8 flex justify-between items-center border-b border-slate-50">
                <h2 class="text-2xl font-bold">Settings</h2>
                <button id="closeSidebar" class="p-2 hover:bg-slate-100 rounded-full">✕</button>
            </div>
            <nav class="flex-1 p-6 space-y-2">
                <button class="w-full text-left px-6 py-5 rounded-2xl hover:bg-slate-50 font-bold text-slate-700">About CareID</button>
                <button class="w-full text-left px-6 py-5 rounded-2xl hover:bg-slate-50 font-bold text-slate-700">Riwayat Donasi</button>
                <button onclick="window.location.href='login.html'" class="w-full text-left px-6 py-5 rounded-2xl bg-red-50 text-red-600 font-bold mt-10">Logout</button>
            </nav>
        </div>
    </div>

    <footer class="py-12 border-t border-slate-100 text-center">
        <p class="text-slate-400 text-sm font-medium">© 2026 CareID. Dibuat untuk Kemanusiaan.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
